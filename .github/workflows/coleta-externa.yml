# Coleta agendada das fontes sem API oficial.
#
# Roda no próprio GitHub Actions, saindo pelo proxy residencial configurado em
# secrets. Sem o proxy o workflow ainda roda, mas várias fontes respondem 403
# ou devolvem página vazia para IP de datacenter — que é o IP dos runners.
#
# O resultado é comitado em dados/externo/, o que faz do histórico do git o
# registro público da coleta: dá para ver, commit a commit, o que cada fonte
# devolveu e quando um valor mudou.
#
# SEGURANÇA: este workflow dispara apenas por agendamento e por acionamento
# manual. Não use `pull_request` nem `pull_request_target` aqui — em repositório
# público, isso exporia os secrets a qualquer pessoa que abrisse um PR.

name: Coleta externa

on:
  schedule:
    - cron: "0 7 * * 1"   # segundas, 7h UTC (4h em Brasília)
  workflow_dispatch:
    inputs:
      cargo:
        description: "Código do cargo no TSE (1 presidente, 3 governador, 5 senador, 6 dep. federal, 7 dep. estadual)"
        required: true
        default: "6"
      uf:
        description: "Sigla da UF"
        required: true
        default: "SP"
      fontes:
        description: "Fontes a coletar, separadas por espaço (vazio = todas as automáticas)"
        required: false
        default: ""
      navegador:
        description: "Instalar o navegador para as fontes que exigem renderização"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: coleta-externa
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Proxy residencial: sem ele, boa parte das fontes recusa o IP do runner.
      COLETOR_PROXY: ${{ secrets.COLETOR_PROXY }}
      # Chaves gratuitas das APIs oficiais.
      CHAVE_PORTAL_TRANSPARENCIA: ${{ secrets.CHAVE_PORTAL_TRANSPARENCIA }}
      CHAVE_DATAJUD: ${{ secrets.CHAVE_DATAJUD }}
      # Ritmo: melhor sobrar do que apanhar de rate limit.
      COLETOR_INTERVALO: "2.5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o navegador
        if: inputs.navegador != false
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Confirmar por qual IP a coleta vai sair
        run: |
          if [ -z "$COLETOR_PROXY" ]; then
            echo "::warning::COLETOR_PROXY não está definido. A coleta vai sair pelo IP"
            echo "::warning::do runner, que várias fontes recusam. Configure o secret."
          fi
          # Imprime host e IP de saída; nunca usuário e senha.
          python3 scripts/coletar.py --verificar-saida

      - name: Montar a base do TSE
        run: python3 scripts/importar_tse.py --baixar --ano 2026

      - name: Coletar
        run: |
          cargo="${{ inputs.cargo || '6' }}"
          uf="${{ inputs.uf || 'SP' }}"
          fontes="${{ inputs.fontes }}"

          argumentos=""
          for fonte in $fontes; do
            argumentos="$argumentos --fonte $fonte"
          done

          # Código 2 significa "rodou, mas nenhuma fonte devolveu registro":
          # não é falha do fluxo, é informação para o passo seguinte.
          python3 scripts/coletar.py $argumentos --cargo "$cargo" --uf "$uf" \
            --ano 2026 --somente-deferidos || [ $? -eq 2 ]

      - name: Conferir o que foi coletado
        id: conferir
        run: |
          python3 scripts/importar_externos.py dados/externo/ --estrito
          if git status --porcelain dados/externo | grep -q .; then
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mudança nos dados coletados."
          fi

      - name: Publicar o resultado
        if: steps.conferir.outputs.mudou == 'sim'
        run: |
          git config user.name "coleta-automatica"
          git config user.email "coleta-automatica@users.noreply.github.com"
          git add dados/externo
          git commit -m "Coleta externa de $(date -u +%Y-%m-%d)"
          git push
